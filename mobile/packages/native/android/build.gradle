plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.zappynative'
version = '1.0.0'

android {
  namespace "expo.modules.zappynative"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

// Expo SDK 56 links expo-notifications as a prebuilt AAR (its local-maven-repo), so the
// ':expo-notifications' Gradle project exists only when it is built from source.
def expoNotificationsProject = rootProject.findProject(':expo-notifications')
def expoNotificationsVersion = {
  def pkgJson = providers.exec {
    workingDir(projectDir)
    commandLine("node", "--print", "require.resolve('expo-notifications/package.json')")
  }.standardOutput.asText.get().trim()
  new groovy.json.JsonSlurper().parse(new File(pkgJson)).version
}

dependencies {
  if (expoNotificationsProject != null) {
    implementation expoNotificationsProject
  } else {
    implementation "host.exp.exponent:expo.modules.notifications:${expoNotificationsVersion()}"
  }
  implementation 'com.google.firebase:firebase-messaging:25.0.1'
  implementation 'androidx.core:core:1.17.0'
  implementation 'androidx.work:work-runtime:2.10.0'
}
