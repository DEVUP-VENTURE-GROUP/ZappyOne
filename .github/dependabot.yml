version: 2
# Automated, reviewable dependency-update PRs. This is how the audit findings
# (axios ReDoS, form-data CRLF, ws / socket.io / websocket-driver advisories)
# get remediated on an ongoing basis instead of manual bumps.
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk patch/minor bumps into a single PR to cut review noise;
      # majors still come as individual PRs.
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, client]

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, server]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, mobile]

  # Keep the CI/security actions themselves patched (pinned action versions).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
