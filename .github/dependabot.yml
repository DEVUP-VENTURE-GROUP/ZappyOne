version: 2
# Routine version bumps are OFF (open-pull-requests-limit: 0): they opened 30+
# PRs against main that nobody reviewed, majors included (Vite 8, Express 5,
# Expo 57), any of which can break a launch build. Upgrades are done by the
# team on purpose, through the checkpoint gate.
#
# Security fixes are unaffected: with Dependabot security updates enabled in
# the repo settings, a vulnerable dependency still gets its own fix PR.
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      # Batch low-risk patch/minor bumps into a single PR to cut review noise;
      # majors still come as individual PRs.
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, client]

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, server]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, mobile]

  # Keep the CI/security actions themselves patched (pinned action versions).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: [dependencies, ci]
