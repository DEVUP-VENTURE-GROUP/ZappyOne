name: Secret Scan

# Catches committed credentials — API keys, tokens, private keys, DB URIs.
# On a PR it scans only the pushed commits (fast); on push to main and weekly it
# scans the full history so anything that slipped in earlier is still surfaced.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog · verified secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the scan can diff/blame across commits
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
