name: CI

# Build, test and audit every push to main and every pull request.
# Jobs are independent so a client-only change doesn't wait on the server suite.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per ref — a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: Client · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Dependency audit (report-only)
        # Surfaces vulnerable prod deps in the log without blocking the build.
        # Dependabot (see .github/dependabot.yml) raises the actual upgrade PRs.
        run: npm audit --omit=dev --audit-level=moderate || true

  server:
    name: Server · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Jest
        # The suite runs fully in-memory (mongodb-memory-server + ioredis-mock),
        # so no service containers are needed.
        run: npm test
      - name: Dependency audit (report-only)
        run: npm audit --omit=dev --audit-level=moderate || true

  mobile:
    name: Mobile · deps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Dependency audit (report-only)
        run: npm audit --omit=dev --audit-level=moderate || true
