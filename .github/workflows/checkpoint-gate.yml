name: Checkpoint gate

# Verify-only quality gate for every pull request into checkpoint-main.
# It never changes code: it builds, tests and measures the PR against its base
# and posts PASS or FAIL with exactly what to fix. Make "Checkpoint gate" a
# required status check on checkpoint-main so a FAIL cannot be merged.
on:
  pull_request:
    branches: ['checkpoint-main', 'checkpoint-main-*']
    # `edited` re-runs it when the author fixes the AI declaration in the description.
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: checkpoint-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read        # read the code, never write it
  pull-requests: write  # post the report as one PR comment

jobs:
  gate:
    name: Checkpoint gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the base branch and every PR commit, for before/after and AI trailers

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install (server, apps, gate)
        run: |
          set -e
          for d in server client servicepro rakshak admin events tools/checkpoint-gate; do
            echo "::group::npm ci $d"; (cd "$d" && npm ci --no-audit --no-fund); echo "::endgroup::"
          done

      - name: Run the gate
        id: gate
        continue-on-error: true
        env:
          # Passed through the environment, never interpolated into the script.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          node tools/checkpoint-gate/run.js --base "origin/$BASE_REF" --out gate-report --pr-body-file "$RUNNER_TEMP/pr-body.md"

      - name: Upload the report (shareable HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-gate-report-pr${{ github.event.pull_request.number }}
          path: gate-report/
          retention-days: 30

      - name: Post the report on the PR
        if: always() && hashFiles('gate-report/report.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- checkpoint-gate -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = fs.readFileSync('gate-report/report.md', 'utf8')
              + `\n[Full report (HTML) in the run's artifacts](${runUrl})\n`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Verdict
        if: steps.gate.outcome != 'success'
        run: |
          echo "::error::Checkpoint gate FAILED — see the PR comment or the report artifact for what to fix."
          exit 1
